# Include this file once, inside the existing ota.fanfh.cn HTTPS server block.
# It deliberately contains no server, health, ACME, root, or release directives.
location = /admin {
    if ($scheme != https) {
        return 308 https://$host$request_uri;
    }
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    return 308 /admin/;
}

location ^~ /admin/ {
    if ($scheme != https) {
        return 308 https://$host$request_uri;
    }
    proxy_pass http://127.0.0.1:18091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 2147483648;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
